# Prism Arcade favicon (matching .brand-mark: gradient tile + "P" monogram)
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#g)"/>
  <text x="32" y="33" text-anchor="middle" dominant-baseline="central" font-family="Rubik,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="900" fill="#141527">P</text>
</svg>
